name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    # Xcode 26.6 has a confirmed Swift IRGen crash in SettingsView.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Remove synced-folder metadata
        run: xattr -cr Sources Tests || true
      - name: Test macOS app
        env:
          COPYFILE_DISABLE: "1"
        run: swift test --scratch-path "$RUNNER_TEMP/platform-spm"

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_SHA256: e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan repository history for secrets
        run: "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose

  repository:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Validate repository metadata
        run: |
          source release/version.env
          test "$PLATFORM_VERSION" = "0.2.4"
          test "$PLATFORM_BUILD" = "15"
          plutil -lint release/Info.plist
          zsh -n scripts/package-app.sh
          zsh -n scripts/verify-release.sh
          test -s LICENSES/OFL-1.1.txt
          test -s THIRD_PARTY_NOTICES.md
          test -s docs/HISTORICAL_RELEASES.md
          test -s docs/assets/display.png
          test -s docs/assets/extended.png
          test -s docs/assets/list.png
          test -s docs/assets/service-details.png
